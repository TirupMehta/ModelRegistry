name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate registry data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs scripts/validate-registry.js (schema, flagship rule, links,
      # leaderboard refs) + scripts/test-fallback.js, and auto-syncs README table
      - run: pnpm test

      # Fail if the contributor forgot to run `pnpm test` (README table out of sync)
      - name: Check README table is in sync
        run: git diff --exit-code README.md

  build:
    name: Build site
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
