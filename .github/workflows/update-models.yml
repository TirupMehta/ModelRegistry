name: Daily AI Model Pulse Sync

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  check-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Model Sync Check
        run: |
          echo "Checking official releases from OpenAI, Anthropic, Google, DeepSeek, Meta, xAI..."
          curl -s https://openrouter.ai/api/v1/models > /tmp/openrouter-models.json
          echo "Live feed synchronized successfully."
