name: Refresh independent results

# The standing and /best rest on independent results that move every few days.
# This re-reads the evaluator's pages twice a week and, when anything changed,
# opens a pull request with the diff. Nothing is published until a person merges
# it, so a parsing slip can never reach the site on its own.
on:
  schedule:
    - cron: "0 6 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-independent
  cancel-in-progress: true

jobs:
  refresh:
    name: Re-read Artificial Analysis and open a PR if values moved
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refresh values from the evaluator
        id: refresh
        run: |
          set +e
          node scripts/refresh-independent.mjs --write | tee "$RUNNER_TEMP/refresh.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "The refresh script failed with exit $status" >&2
            exit "$status"
          fi
          if git diff --quiet -- data/independent-benchmarks.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The log is the only record of which pages could not be re-read, so it
      # belongs on the run page whether or not any value moved. A failed pull
      # request used to leave it invisible.
      - name: Put the read on the run page
        if: always()
        run: |
          log="$RUNNER_TEMP/refresh.log"
          [ -f "$log" ] || exit 0
          {
            echo "### Independent results refresh"
            echo
            echo "<details><summary>Full report</summary>"
            echo
            echo '```'
            cat "$log"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate the dataset revision and run the tests
        if: steps.refresh.outputs.changed == 'true'
        run: |
          node scripts/write-revision.js
          pnpm test

      - name: Open a pull request
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="refresh/independent-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -B so a second run on the same day updates the branch instead of
          # dying on "branch already exists"; the push below force-updates it.
          git checkout -B "$branch"
          git add data/independent-benchmarks.ts data/revision.ts README.md
          git commit -m "chore(data): refresh independent results"
          git push --force origin "$branch"

          # Only real value moves, not the "Not refreshed:" lines below them.
          {
            echo "Automated re-read of the Artificial Analysis comparison pages."
            echo
            grep -m1 'pages read,' "$RUNNER_TEMP/refresh.log" || true
            echo
            echo "Changed values:"
            echo
            grep -E '^  [a-z0-9-]+\.[a-zA-Z]+: .* -> .*$' "$RUNNER_TEMP/refresh.log" | sed 's/^  /- /' || true
            echo
            echo "Records that could not be re-read are listed in the run summary; their values are unchanged, not re-verified."
            echo
            echo "arena.ai blocks automated reads, so the Text Arena Elo is not part of this and must be refreshed by hand."
          } > "$RUNNER_TEMP/pr-body.md"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr comment "$branch" --body "Refresh re-run at $(date -u +%FT%TZ); the branch and diff above carry the newer read."
            exit 0
          fi

          gh pr create --title "Refresh independent results" --body-file "$RUNNER_TEMP/pr-body.md" || {
            echo "::error::GITHUB_TOKEN cannot open pull requests in this repository. Enable Settings -> Actions -> General -> Workflow permissions -> 'Allow GitHub Actions to create and approve pull requests'. The refreshed branch $branch is pushed, so the PR can still be opened by hand: https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}"
            exit 1
          }
